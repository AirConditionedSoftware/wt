name: Feature request
description: An idea to make wt better
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that wt makes awkward today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: >
        What should wt do? Sketches of the CLI (`wt add --foo`) or config
        (`"foo": ...`) are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives
      description: How do you handle this today, if at all?
